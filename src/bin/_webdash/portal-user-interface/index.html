<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDash Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>⚡ WebDash Portal</h1>
        <div class="status-dot" id="statusDot"></div>
        <span class="status-label" id="statusLabel">Connecting…</span>
        <div class="tiny-alert" id="editorAlert" style="display:none"></div>
    </header>

    <div class="container">
        <div class="panel">
            <div class="panel-header">
                <h2>Registered Projects</h2>
                <div style="display:flex;align-items:center;gap:8px">
                    <button class="btn-refresh" onclick="refreshAll(this)" title="Refresh all">⟳</button>
                    <span class="badge" id="projectCount">0</span>
                </div>
            </div>
            <div class="panel-body" id="projectList">
                <div class="empty-state">Connecting to server…</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>Recent Actions</h2>
                <span class="badge" id="actionCount">0</span>
            </div>
            <div class="panel-body" id="actionList">
                <div class="empty-state">Waiting for data…</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>IP States</h2>
                <div style="display:flex;align-items:center;gap:8px">
                    <button class="btn-refresh" onclick="refreshIpStates(this)" title="Refresh IP states">⟳</button>
                    <span class="badge" id="ipStateCount">0</span>
                </div>
            </div>
            <div class="panel-body" id="ipStateBody">
                <div class="empty-state">Loading IP states…</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="panel full-width" id="widgetsPanel">
            <div class="panel-header">
                <h2>Widgets</h2>
                <div style="display:flex;align-items:center;gap:8px">
                    <button class="btn-refresh" onclick="refreshWidgets(this)" title="Refresh widgets">⟳</button>
                    <span class="badge" id="widgetCount">0</span>
                </div>
            </div>
            <div class="panel-body" id="widgetList">
                <div class="empty-state">Loading widgets…</div>
            </div>
        </div>

        <div class="panel full-width" id="gitPanel">
            <div class="panel-header">
                <h2>Git Status</h2>
                <div style="display:flex;align-items:center;gap:8px">
                    <button class="btn-refresh" onclick="refreshGit(this)" title="Refresh git status">⟳</button>
                    <span class="badge" id="gitCount">0</span>
                </div>
            </div>
            <div class="panel-body" id="gitList">
                <div class="empty-state">Loading git status…</div>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="configModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">Edit webdash.config.jsonc</div>
                <button class="btn" onclick="closeConfigModal()">Close</button>
            </div>
            <div class="modal-subtitle" id="configModalPath"></div>
            <div class="modal-body">
                <textarea class="modal-textarea" id="configModalText" spellcheck="false"></textarea>
            </div>
            <div class="modal-footer">
                <div class="modal-status" id="configModalStatus"> </div>
                <div class="modal-actions">
                    <button class="btn" id="configModalSave" onclick="saveConfigModal()">Save</button>
                    <button class="btn" onclick="closeConfigModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
